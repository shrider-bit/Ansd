<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGB Word Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Mode: Persuade — one authored moment (the word swap) */
  :root {
    --maroon: #8E1837;
    --maroon-deep: #7B1436;
    --pink: #DF456D;
    --navy: #002C77;
    --white: #ffffff;
    --tint: rgba(255, 255, 255, 0.62);   /* secondary text on maroon: a tint of white */
    --line: rgba(255, 255, 255, 0.22);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-state: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: var(--pink); color: var(--white); }
  body {
    min-height: 100vh;
    background: var(--maroon-deep);
    color: var(--white);
    font-family: "Lusail+", "Lusail", "IBM Plex Sans Arabic", "Noto Kufi Arabic", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .hero {
    width: 100%;
    max-width: 960px;
    text-align: center;
  }
  h1 {
    font-size: clamp(38px, 8.5vw, 92px);
    line-height: 1.35;            /* Arabic headings: 1.3–1.4 */
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .08em;
  }
  .soft { color: var(--tint); font-weight: 500; }

  /* The pill: white ground, maroon word */
  .pill {
    position: relative;
    display: inline-block;
    height: 1.5em;
    border-radius: .3em;
    background: var(--white);
    overflow: hidden;
    transition: width 420ms var(--ease-state);
    box-shadow: 0 14px 32px -14px rgba(0, 0, 0, 0.45);
  }
  .word {
    position: absolute;
    inset-inline-start: 0;
    top: 0;
    padding-inline: .34em;
    line-height: 1.5em;
    white-space: nowrap;
    color: var(--maroon);
    transform: translateY(100%);
    opacity: 0;
    will-change: transform, opacity;
  }
  .word.is-active { transform: translateY(0); opacity: 1; }
  .word.anim-in  { transition: transform 450ms var(--ease-out), opacity 450ms var(--ease-out); }
  .word.anim-out { transition: transform 400ms var(--ease-out), opacity 300ms var(--ease-out); transform: translateY(-100%); opacity: 0; }
  .measure { position: absolute; visibility: hidden; white-space: nowrap; padding-inline: .34em; pointer-events: none; }

  .lede {
    margin: 28px auto 0;
    max-width: 34em;
    font-size: clamp(16px, 2.2vw, 19px);
    line-height: 1.8;
    color: var(--tint);
  }

  /* Dots */
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 32px; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 99px;
    background: var(--line);
    border: 0; padding: 0;
    cursor: pointer;
    transition: width 220ms var(--ease-out), background 220ms var(--ease-out);
  }
  .dot:hover { background: var(--tint); }
  .dot[aria-current="true"] { width: 28px; background: var(--white); }
  .dot:focus-visible, .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  .cta { margin-top: 32px; display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: inherit;
    font-weight: 500;
    font-size: 16px;
    padding: 12px 24px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--white);
    cursor: pointer;
    transition: background 180ms var(--ease-out), border-color 180ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .btn:hover { border-color: var(--tint); background: rgba(255,255,255,.06); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--white); color: var(--maroon); border-color: var(--white); }
  .btn.primary:hover { background: #f6e8ec; }

  @media (prefers-reduced-motion: reduce) {
    .pill, .word, .dot, .btn { transition: none !important; }
  }
</style>
</head>
<body>
  <section class="hero">
    <h1 id="headline" aria-label="نطوّر الكفاءات الوطنية لخدمة حكومية أكثر تميّزًا">
      <span aria-hidden="true">نطوّر</span>
      <span class="pill" id="pill" aria-hidden="true"></span>
      <span class="soft" aria-hidden="true">لخدمة حكومية أكثر تميّزًا</span>
    </h1>
    <p class="lede">نص تعريفي قصير يوضّح دور الديوان ويُستبدل بالصياغة المعتمدة.</p>
    <div class="dots" id="dots" role="tablist" aria-label="محاور التطوير"></div>
    <div class="cta">
      <button class="btn primary">استكشف الخدمات</button>
      <button class="btn">تواصل معنا</button>
    </div>
  </section>

<script>
(() => {
  const WORDS = ["الكفاءات الوطنية", "الخدمات الحكومية", "بيئة العمل", "الأداء المؤسسي"];
  const TAIL = "لخدمة حكومية أكثر تميّزًا";
  const INTERVAL = 2600;

  const pill = document.getElementById("pill");
  const dotsEl = document.getElementById("dots");
  const headline = document.getElementById("headline");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const measure = document.createElement("span");
  measure.className = "measure";
  pill.appendChild(measure);

  const words = WORDS.map((w, i) => {
    const el = document.createElement("span");
    el.className = "word" + (i === 0 ? " is-active" : "");
    el.textContent = w;
    pill.appendChild(el);
    return el;
  });

  const dots = WORDS.map((w, i) => {
    const b = document.createElement("button");
    b.className = "dot";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", w);
    b.setAttribute("aria-current", i === 0 ? "true" : "false");
    b.addEventListener("click", () => { go(i); restart(); });
    dotsEl.appendChild(b);
    return b;
  });

  let current = 0, widths = [];
  const measureAll = () => {
    widths = WORDS.map(w => { measure.textContent = w; return measure.getBoundingClientRect().width; });
    pill.style.width = widths[current] + "px";
  };

  function go(next) {
    if (next === current) return;
    const out = words[current], inn = words[next];
    out.classList.remove("anim-in", "is-active");
    out.classList.add("anim-out");

    inn.classList.remove("anim-out", "anim-in", "is-active");
    inn.style.transform = "translateY(100%)";
    inn.style.opacity = "0";
    void inn.offsetWidth;
    inn.style.transform = "";
    inn.style.opacity = "";
    inn.classList.add("anim-in", "is-active");

    pill.style.width = widths[next] + "px";
    dots[current].setAttribute("aria-current", "false");
    dots[next].setAttribute("aria-current", "true");
    headline.setAttribute("aria-label", `نطوّر ${WORDS[next]} ${TAIL}`);

    setTimeout(() => out.classList.remove("anim-out"), 450);
    current = next;
  }

  let timer = null, visible = true;
  const start = () => { if (!timer && !reduce && visible && !document.hidden) timer = setInterval(() => go((current + 1) % WORDS.length), INTERVAL); };
  const stop = () => { clearInterval(timer); timer = null; };
  const restart = () => { stop(); start(); };

  new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? start() : stop(); }, { threshold: 0.3 })
    .observe(document.querySelector(".hero"));
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { measureAll(); start(); });
  addEventListener("resize", measureAll);
})();
</script>
</body>
</html>
