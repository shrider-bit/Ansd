name: Web version (GitHub Pages)

# Publishes the browser version to GitHub Pages. Pages hosts files only, so
# online play needs the multiplayer server too (set the GAME_SERVER_URL
# repository variable). Practice mode works without it.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", then set the
# repository variable ENABLE_PAGES to "true".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.ENABLE_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
