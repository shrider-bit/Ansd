/* بيّنة — «ملف القضية»: ورقة بيضاء على مكتب رمادي بارد، حبر، عنّابي مؤسسي، وخيط نحاسي.
   البنية بالمساطر والألسنة والطباعة، لا بالبطاقات المظلَّلة. */
:root {
  color-scheme: light;
  --desk: #EEEBED; --sheet: #FFFFFF; --wash: #FAF8F9;
  --ink: #1D181B; --ink2: #4A4146; --ink3: #776D73; --ink4: #B9B1B5;
  --rule: #D8D1D5; --rule2: #ECE7EA;
  --maroon: #8A1538; --maroon-d: #5E0D26; --maroon-t: #F6E9ED;
  --brass: #8E7235; --brass-l: #C9B27A; --brass-t: #F5EFE0;
  --pine: #2B6B55; --pine-t: #E5F0EB;
  --amber: #96590A; --amber-t: #FAF0DD;
  --slate: #3D4D6C; --slate-l: #8795B0; --slate-t: #E6EAF2;
  --red: #9E3A2C; --red-t: #F8E9E6;
  --ui: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
  --doc: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
  --hatch: repeating-linear-gradient(135deg, var(--ink4) 0 1.5px, transparent 1.5px 5px);
  --head-h: 96px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head-h) + 12px); }
body { margin: 0; background: var(--desk); color: var(--ink); font: 400 13.5px/1.75 var(--ui); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { text-wrap: balance; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--maroon); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.ico { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
.flip { display: inline-flex; transform: scaleX(-1); }

/* ---------- الشريط العلوي وألسنة الملف ---------- */
.top { position: sticky; top: 0; z-index: 40; background: var(--sheet); border-top: 3px solid var(--maroon); }
.top-in { max-width: 1360px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lab-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink3); text-decoration: none; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
.lab-link:hover { color: var(--maroon); background: var(--maroon-t); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--maroon); padding-inline-start: 14px; border-inline-start: 1px solid var(--rule); }
.brand-mark { width: 32px; height: 32px; flex: none; }
.brand b { display: block; font-size: 21px; font-weight: 800; line-height: 1.2; }
.brand span { display: block; font-size: 11px; color: var(--ink3); line-height: 1.4; }
.demo-badge { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--brass); background: var(--brass-t); border: 1px solid var(--brass-l); padding: 3px 10px; border-radius: 2px; white-space: nowrap; }
.demo-badge i { width: 7px; height: 7px; background: var(--brass); transform: rotate(45deg); }
.top-acts { display: flex; gap: 6px; }
.tabs { display: flex; gap: 3px; max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.top::after { content: ""; display: block; height: 0; border-bottom: 1px solid var(--ink); margin-top: -1px; }
.tab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; background: var(--desk); border: 1px solid var(--rule); border-bottom-color: var(--ink); border-radius: 7px 7px 0 0; padding: 6px 18px 5px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.tab:hover { color: var(--maroon); background: var(--wash); }
.tab.on { background: var(--sheet); color: var(--ink); border-color: var(--ink); border-bottom-color: var(--sheet); z-index: 1; box-shadow: inset 0 2px 0 var(--maroon); }
.tab em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--ink3); background: var(--sheet); border: 1px solid var(--rule); padding: 0 6px; border-radius: 2px; line-height: 1.6; }

.meter em { font-style: normal; font-size: 19px; font-weight: 800; margin-inline-start: 6px; }
.meter.g-strong i.on { background: var(--pine); border-color: var(--pine); } .meter.g-strong b, .meter.g-strong em { color: var(--pine); }

.empty { padding: 28px 12px; text-align: center; color: var(--ink3); }
select, input[type="search"], input[type="number"], textarea { border: 1px solid var(--ink4); background: var(--sheet); border-radius: 3px; padding: 5px 10px; font-size: 12.5px; line-height: 1.6; max-width: 100%; }

/* ---------- النافذة، الدرج، الإشعار، الجولة ---------- */

.toast { position: fixed; z-index: 95; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 16px); max-width: calc(100% - 32px); background: var(--ink); color: #fff; font-size: 12.5px; padding: 8px 16px; border-radius: 3px; border-inline-start: 4px solid var(--pine); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }

.tour-block { position: fixed; inset: 0; z-index: 80; }

.tour-card { position: fixed; z-index: 82; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); background: var(--sheet); border-top: 3px solid var(--maroon); padding: 14px 18px 12px; box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .55); }
.tc-step { font-size: 11.5px; font-weight: 600; color: var(--brass); }
.tour-card h3 { font-size: 16px; font-weight: 700; margin: 2px 0 4px; }

#print-root { display: none; }

@media (max-width: 760px) {

}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- ① صندوق الطلبات ---------- */

.progress, .splitbar { display: flex; gap: 2px; }
.progress { height: 8px; margin-top: 12px; } .progress i { min-width: 3px; }
.sp-approve { background: var(--pine); } .sp-amend { background: var(--amber); } .sp-defer { background: var(--slate); } .sp-return { background: var(--red); } .sp-open { background: var(--rule); }

.reqs { margin-top: 18px; }

.req-head, .req { display: grid; grid-template-columns: 104px minmax(160px, 1.5fr) minmax(150px, 1.25fr) minmax(190px, 1.3fr) 112px 116px 148px; gap: 14px; align-items: center; padding: 8px 10px; }
.req-head { font-size: 11.5px; font-weight: 600; color: var(--ink3); border-bottom: 2px solid var(--ink); padding-block: 6px; margin-top: 8px; }
.req { border-bottom: 1px solid var(--rule2); cursor: pointer; transition: background .12s; }
.req:hover { background: var(--wash); box-shadow: inset 3px 0 0 var(--maroon); }
[dir="rtl"] .req:hover { box-shadow: inset -3px 0 0 var(--maroon); }

.ds-wf, .ds-ev, .ds-bottom { margin-top: 26px; }
.wf-row { display: grid; grid-template-columns: 236px minmax(0, 1fr) 62px 46px; column-gap: 14px; align-items: center; min-height: 40px; border-bottom: 1px solid var(--rule2); padding-inline: 8px; }

/* ---------- ③ المحفظة ---------- */

.cons-wrap { max-width: 460px; } svg.ch-scatter { width: 100%; height: auto; display: block; } .ch-scatter .pt { cursor: pointer; } .ch-scatter .pt:hover > :last-child, .ch-scatter .pt:focus > :last-child { stroke-width: 3; }

<script>
/* Shared SYNTHETIC reference data + helpers for all Innovation Lab prototypes.
   Everything here is invented for demonstration. Entity names are deliberately
   neutral ("جهة الصحة (أ)") so nothing can be mistaken for a real government body. */
const CGB = (() => {
  // Deterministic PRNG (mulberry32) so every demo run shows the same numbers.
  function rng(seed) {
    let a = seed >>> 0;
    const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.normal = (mu = 0, sd = 1) => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r();
      return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  }
  const SECTORS = [
    { id: 'health', ar: 'الصحة' }, { id: 'edu', ar: 'التعليم' },
    { id: 'econ', ar: 'الاقتصاد والمالية' }, { id: 'infra', ar: 'البنية التحتية' },
    { id: 'muni', ar: 'الخدمات البلدية' }, { id: 'social', ar: 'الشؤون الاجتماعية' },
    { id: 'energy', ar: 'الطاقة والبيئة' }, { id: 'gov', ar: 'الإدارة الحكومية' },
  ];
  const SIZES = { health: [16800, 9400, 2100], edu: [18900, 3300, 1250], econ: [2450, 1380, 760],
    infra: [5900, 3150, 1420], muni: [6700, 2250, 980], social: [2900, 1150, 640],
    energy: [2050, 890, 560], gov: [1950, 1100, 430] };
  const LETTERS = ['أ', 'ب', 'ج'];
  const ENTITIES = [];
  SECTORS.forEach(s => SIZES[s.id].forEach((n, i) => ENTITIES.push({
    id: 'E' + String(ENTITIES.length + 1).padStart(2, '0'), sector: s.id, sectorAr: s.ar,
    ar: `جهة ${s.ar} (${LETTERS[i]})`, short: `${s.ar} ${LETTERS[i]}`, headcount: n })));
  // 12 job families (المجموعات الوظيفية). qShare = synthetic share of Qatari staff.
  const FAMILIES = [
    { id: 'admin', ar: 'الإدارية والمكتبية', qShare: .78 }, { id: 'fin', ar: 'المالية والمحاسبية', qShare: .58 },
    { id: 'legal', ar: 'القانونية', qShare: .70 }, { id: 'eng', ar: 'الهندسية', qShare: .31 },
    { id: 'it', ar: 'تقنية المعلومات والبيانات', qShare: .34 }, { id: 'health', ar: 'الصحية والطبية', qShare: .22 },
    { id: 'edu', ar: 'التعليمية والتربوية', qShare: .46 }, { id: 'hr', ar: 'الموارد البشرية', qShare: .81 },
    { id: 'plan', ar: 'التخطيط والإحصاء', qShare: .49 }, { id: 'cs', ar: 'خدمة المتعاملين', qShare: .74 },
    { id: 'tech', ar: 'الفنية والحرفية', qShare: .18 }, { id: 'audit', ar: 'الرقابة والتدقيق', qShare: .62 },
  ];
  // Grade bands follow the convention used in the department's own reference notes.
  const GRADE_BANDS = [
    { id: 'entry', ar: 'مساعد', lo: 1, hi: 3 }, { id: 'spec', ar: 'أخصائي', lo: 4, hi: 6 },
    { id: 'senior', ar: 'أخصائي أول / مشرف', lo: 7, hi: 9 }, { id: 'mgr', ar: 'مدير', lo: 10, hi: 12 },
    { id: 'dir', ar: 'مدير عام', lo: 13, hi: 15 }, { id: 'exec', ar: 'قيادي', lo: 16, hi: 18 },
  ];
  const RULES = { retirementAge: 60, earlyRetirementService: 25, qatarizationBenchmark: .60, baseYear: 2026 };
  // ---- formatting helpers (Western digits everywhere for consistency) ----
  const num = (v, d = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, d = 0) => (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d) + '%';
  const signed = (v, d = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + num(Math.abs(v), d);
  // Compact riyal amounts: 1,250,000 -> "1.25 مليون ر.ق"
  const qar = v => { const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e9) return s + (a / 1e9).toFixed(2) + ' مليار ر.ق';
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1) + ' مليون ر.ق';
    if (a >= 1e3) return s + num(Math.round(a / 1e3)) + ' ألف ر.ق'; return s + num(a) + ' ر.ق'; };
  const pad2 = n => String(n).padStart(2, '0');
  const gdate = (d = new Date()) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
  // Hijri (Umm al-Qura) date as DD/MM/YYYYهـ; falls back to '' if the browser lacks the calendar.
  const hijri = (d = new Date()) => { try {
      const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d);
      const g = t => p.find(x => x.type === t).value; return `${g('day')}/${g('month')}/${g('year')}هـ`; } catch (e) { return ''; } };
  const bothDates = (d = new Date()) => { const h = hijri(d); return gdate(d) + 'م' + (h ? ' — ' + h : ''); };
  // Arabic text normalisation for matching (strip diacritics/tatweel, unify alef/ya/ta-marbuta).
  const normAr = s => String(s || '').replace(/[ً-ْٰـ]/g, '').replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/\s+/g, ' ').trim().toLowerCase();
  const byId = (arr, id) => arr.find(x => x.id === id);
  return { rng, SECTORS, ENTITIES, FAMILIES, GRADE_BANDS, RULES, num, pct, signed, qar, gdate, hijri, bothDates, normAr, byId };
})();
if (typeof module !== 'undefined') module.exports = CGB;

/* بيّنة — دورة تخطيط افتراضية (خطة القوى العاملة 2027).
   كل ما في هذا الملف بيانات تجريبية مولَّدة آلياً ببذرة ثابتة؛ لا تمثّل أي جهة حقيقية. */
const BY = { CYCLE: 2027 };

// خصائص المجموعات الوظيفية: مُحرِّك عبء العمل، المعدل المعياري للإنتاجية، نسبة قابلية الأتمتة، وحدات تنظيمية نموذجية
BY.FAM = {
  admin: { driver: 'المعاملات الإدارية المنجزة', std: 1800, auto: .32, seekers: 420, units: ['إدارة الشؤون الإدارية', 'قسم الخدمات المساندة', 'قسم المراسلات والأرشفة'] },
  fin:   { driver: 'المطالبات والقيود المالية', std: 2400, auto: .28, seekers: 160, units: ['إدارة الشؤون المالية', 'قسم الحسابات', 'قسم الموازنة'] },
  legal: { driver: 'العقود والمذكرات القانونية', std: 220, auto: .10, seekers: 95, units: ['إدارة الشؤون القانونية', 'قسم العقود والاتفاقيات', 'قسم القضايا'] },
  eng:   { driver: 'طلبات المراجعة والتصاريح الهندسية', std: 140, auto: .08, seekers: 70, units: ['إدارة المشاريع', 'قسم التصميم الهندسي', 'قسم التشغيل والصيانة'] },
  it:    { driver: 'طلبات الدعم الفني والتغيير', std: 900, auto: .15, seekers: 55, units: ['إدارة نظم المعلومات', 'قسم الأمن السيبراني', 'قسم تحليل البيانات'] },
  health:{ driver: 'زيارات المراجعين', std: 2600, auto: .05, seekers: 40, units: ['إدارة الرعاية الأولية', 'قسم الطوارئ', 'قسم المختبرات', 'قسم التمريض'] },
  edu:   { driver: 'الطلبة المسجَّلون', std: 14, auto: .04, seekers: 180, units: ['إدارة شؤون المدارس', 'قسم التعليم المبكر', 'قسم التوجيه التربوي'] },
  hr:    { driver: 'معاملات شؤون الموظفين', std: 1500, auto: .25, seekers: 140, units: ['إدارة الموارد البشرية', 'قسم التدريب والتطوير'] },
  plan:  { driver: 'التقارير والدراسات المنجزة', std: 36, auto: .18, seekers: 45, units: ['إدارة التخطيط والجودة', 'قسم الإحصاء'] },
  cs:    { driver: 'معاملات المتعاملين', std: 5200, auto: .35, seekers: 260, units: ['إدارة خدمة المتعاملين', 'مركز الاتصال', 'قسم الخدمات الإلكترونية'] },
  tech:  { driver: 'أوامر الصيانة المنفَّذة', std: 480, auto: .06, seekers: 25, units: ['قسم الصيانة الفنية', 'قسم المرافق', 'قسم النقل والآليات'] },
  audit: { driver: 'مهام التدقيق والتفتيش', std: 48, auto: .12, seekers: 38, units: ['إدارة التدقيق الداخلي', 'قسم الرقابة والتفتيش'] },
};

// وزن حضور كل مجموعة وظيفية في القطاع (لتوزيع الطلبات توزيعاً معقولاً) + أولوية القطاع الخدمية
BY.SECTOR = {
  health: { crit: 1.00, fam: { health: 5, admin: 1.5, it: 1, cs: 1, fin: .7, tech: .8, hr: .5 } },
  edu:    { crit: .95, fam: { edu: 5, admin: 1.5, it: .8, cs: .6, hr: .6, plan: .4 } },
  econ:   { crit: .70, fam: { fin: 3, audit: 2, legal: 1.2, it: 1, plan: 1, admin: 1 } },
  infra:  { crit: .80, fam: { eng: 4, tech: 2.5, it: 1, admin: 1, legal: .6, fin: .6 } },
  muni:   { crit: .75, fam: { tech: 3, eng: 2, cs: 2, audit: 1.5, admin: 1 } },
  social: { crit: .80, fam: { cs: 3, admin: 1.5, hr: .8, plan: .8, legal: .8, it: .6 } },
  energy: { crit: .70, fam: { eng: 3, tech: 2, audit: 1.2, it: 1, plan: .8, fin: .6 } },
  gov:    { crit: .60, fam: { hr: 2.5, plan: 2, it: 1.5, admin: 1.5, legal: 1, audit: 1, fin: 1 } },
};
BY.FAM_CRIT = { health: 1, edu: .95, eng: .9, it: .9, audit: .8, legal: .75, plan: .75, tech: .75, fin: .7, cs: .7, hr: .6, admin: .55 };
BY.GRADE_COST = { entry: 156000, spec: 252000, senior: 348000, mgr: 468000 };
BY.FAM_COST = { health: 1.18, it: 1.15, eng: 1.15, legal: 1.10 };
BY.DOCS = ['بيانات عبء العمل لثلاث سنوات', 'الهيكل التنظيمي المعتمد للوحدة', 'بطاقات الوصف الوظيفي', 'بيان الشواغر الحالية', 'خطة التقطير للوظائف المطلوبة'];
BY.JUST = {
  growth: { ar: 'نمو حجم الخدمة', text: q => `شهدت الوحدة ارتفاعاً متواصلاً في ${q.fam.driver} خلال السنوات الثلاث الماضية، وأصبح الكادر الحالي (${q.staff} موظفاً) غير كافٍ للوفاء بمستويات الخدمة المستهدفة. وعليه نطلب استحداث ${q.requested} وظيفة لمواكبة النمو المتوقع في عام 2027.` },
  mandate:{ ar: 'اختصاص جديد', text: q => `أُسندت إلى الوحدة اختصاصات إضافية ضمن إعادة تنظيم الجهة، ويتطلب تشغيلها استحداث ${q.requested} وظيفة في مجموعة الوظائف «${q.fam.ar}» لتغطية المهام المضافة دون الإخلال بالأعمال القائمة.` },
  retire: { ar: 'إحلال المتقاعدين', text: q => `يُتوقع أن يبلغ عدد من موظفي الوحدة سن التقاعد خلال الأعوام القليلة المقبلة، ونطلب استحداث ${q.requested} وظيفة لضمان استمرارية العمل ونقل المعرفة قبل مغادرتهم.` },
  overtime:{ ar: 'تقليل العمل الإضافي والإسناد', text: q => `تعتمد الوحدة حالياً على العمل الإضافي وعقود الإسناد الخارجي لتغطية حجم العمل، ونطلب استحداث ${q.requested} وظيفة دائمة لخفض هذه التكاليف وتحسين استقرار الخدمة.` },
  qatar:  { ar: 'رفع نسبة التقطير', text: q => `ضمن خطة الجهة لرفع نسبة التقطير في مجموعة الوظائف «${q.fam.ar}»، نطلب استحداث ${q.requested} وظيفة تُخصَّص لاستقطاب الكفاءات الوطنية في الوحدة وتأهيلها.` },
};

BY.generate = function () {
  const R = CGB.rng(20270114), U = (a, b) => a + R() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const wpick = obj => { const ks = Object.keys(obj); let t = ks.reduce((s, k) => s + obj[k], 0) * R();
    for (const k of ks) { t -= obj[k]; if (t <= 0) return k; } return ks[ks.length - 1]; };

  // سجل استغلال الموافقات السابقة لكل جهة (دورتا 2025 و2026)
  const track = {};
  CGB.ENTITIES.forEach(e => {
    const u = clamp(R.normal(.76, .2), .38, .99), cyc = [2025, 2026].map(y => {
      const approved = Math.max(6, Math.round(e.headcount * U(.006, .016)));
      return { year: y, approved, filled: Math.min(approved, Math.round(approved * clamp(u + U(-.07, .07), .2, 1))) }; });
    const a = cyc[0].approved + cyc[1].approved, f = cyc[0].filled + cyc[1].filled;
    track[e.id] = { cycles: cyc, approved: a, filled: f, util: f / a, readiness: U(.35, .95) };
  });

  // رزمة الأنماط: تضمن تنوّع الحالات (مبرَّرة، مبالغ فيها، تُسدّ بالشواغر، بالتدوير، بالأتمتة، إحلال، ناقصة، دون الاحتياج)
  const deck = [];
  Object.entries({ solid: 16, inflated: 12, vacancy: 9, redeploy: 6, digital: 5, retire: 5, missing: 5, underask: 2 })
    .forEach(([k, n]) => { for (let i = 0; i < n; i++) deck.push(k); });
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }

  const reqs = [];
  CGB.ENTITIES.forEach((e, ei) => {
    const n = e.headcount >= 15000 ? (ei === 0 ? 5 : 4) : e.headcount >= 9000 ? 4 : e.headcount >= 2500 ? 3 : 2;
    const used = new Set();
    for (let k = 0; k < n; k++) {
      const arche = deck[reqs.length % deck.length];
      const weights = Object.assign({}, BY.SECTOR[e.sector].fam);

      // سلسلة عبء العمل: تُبنى بحيث يساوي الاحتياج المحتسب (S + T) تقريباً؛ المحرك يشتق الأرقام منها ولا يقرؤها جاهزة

  // تُضبط المدخلات فقط؛ التوصية نفسها يحسبها المحرك كأي طلب آخر.

/* بيّنة — محرك الأدلة: قواعد معلنة قابلة للتدقيق (ليست ذكاءً اصطناعياً ولا نموذجاً تنبؤياً).
   كل رقم في التوصية ناتج عن الصيغ أدناه ويمكن إعادة احتسابه يدوياً. */
BY.RULES = {
  wWorkload: .6, wBench: .4,          // وزن تقدير عبء العمل وتقدير المقارنة المرجعية في الاحتياج المرجَّح
  redeployRealisation: .5,            // نسبة ما يُعوَّل عليه من المرشحين المناسبين للتدوير
  phasedBelow: .65,                   // دون هذه النسبة من استغلال الموافقات السابقة يصبح الاعتماد مرحلياً
  staleMonths: 18,                    // شاغر تجاوز هذه المدة يُعدّ مجمّداً
  strong: 85, medium: 68,             // حدود درجات قوة الأدلة
  fast: { maxPosts: 15, maxCost: 5e6, minUtil: .7, minAgree: .7 },
  weights: { workload: 30, bench: 20, vac: 10, dep: 10, redeploy: 5, pipeline: 5, digital: 5, track: 15 },
  hours: { manual: 6, fast: .5, deep: 2.5, missing: 1 },
  consistencyBand: .15,
};
BY.GRADES = { strong: 'قوية', medium: 'متوسطة', weak: 'ضعيفة', missing: 'ناقصة' };
BY.LANES = { fast: 'مسار سريع', deep: 'مراجعة معمّقة', missing: 'أدلة ناقصة' };

BY.median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

BY.assess = function (q) {
  const K = BY.RULES, cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const R = q.requested, S = q.staff, hasW = !!q.workload;
  const dep1 = q.departures.ret[0] + q.departures.attrExp;       // المغادرون المتوقعون في سنة الخطة
  const avail = S - dep1;                                         // الموجود المتوقع في سنة الخطة
  const med = BY.median(q.bench.peers), std = q.bench.std;
  // 1) عبء العمل: إسقاط حجم العمل بمتوسط النمو السنوي ثم قسمته على المعدل المعياري
  let g = null, proj, Qw = null, own = null, stab = 0;
  if (hasW) { const v = q.workload.volume, g1 = v[1] / v[0] - 1, g2 = v[2] / v[1] - 1; g = (g1 + g2) / 2; proj = v[2] * (1 + g); Qw = proj / std; own = v[2] / S;
    stab = 1 - Math.min(1, Math.abs(g2 - g1) / .08); }               // استقرار السلسلة: فرق 8 نقاط بين نموّ السنتين = صفر
  else proj = q.bench.refVolume;                                   // تقدير مركزي عند غياب بيانات الجهة
  // 2) المقارنة المرجعية: العدد اللازم لو عملت الوحدة بإنتاجية وسيط الجهات المماثلة
  const Qb = proj / med;
  const Qstar = Math.ceil(hasW ? K.wWorkload * Qw + K.wBench * Qb : Qb);
  const W = hasW ? Math.max(0, Math.ceil(Qw) - avail) : null, B = Math.max(0, Math.ceil(Qb) - avail);

  const underAsk = underBy >= Math.max(3, Math.ceil(R * .2)) ? underBy : 0;   // يُنبَّه فقط إذا بلغ الفرق 3 وظائف و20% من المطلوب
  // 3-7) مصادر تغطية الاحتياج قبل استحداث وظائف جديدة — بالترتيب
  let rem = J;
  const useDep = Math.min(rem, dep1); rem -= useDep;               // إحلال على الدرجات التي ستشغر
  const useVac = Math.min(rem, q.vacancies.vacant); rem -= useVac; // شغل الشواغر المعتمدة
  const rdCap = Math.floor(q.redeploy.suitable * K.redeployRealisation);
  const useRd = Math.min(rem, rdCap); rem -= useRd;                // تدوير داخلي بين الجهات
  const autoShare = q.digital.project ? q.digital.auto * q.digital.readiness : 0;

  const N = rem;                                                   // وظائف جديدة موصى باستحداثها
  // مدى الثقة: نصف الفرق بين التقديرين، أو نصف تقدير المقارنة عند غياب بيانات عبء العمل
  const agree = hasW ? 1 - Math.min(1, Math.max(0, Math.abs(W - B) - 1) / Math.max(W, B, 3)) : 0;   // فرق وظيفة واحدة لا يُعدّ اختلافاً
  const delta = hasW ? Math.ceil(Math.abs(W - B) / 2) : Math.max(2, Math.ceil(B / 2));
  const conf = [Math.max(0, N - delta), Math.min(R + underAsk, N + delta)];
  // قوة الأدلة (0-100): موثوقية قاعدة الأدلة، لا مقدار تأييدها للطلب
  const util = q.track.util, w = K.weights, docsOk = q.docs.filter(Boolean).length, missDocs = q.docs.length - docsOk;
  const qual = { workload: hasW ? .5 * agree + .5 * stab : 0, bench: (q.bench.peers.length >= 6 ? 1 : .7) * (hasW ? .4 + .6 * agree : .5),
    vac: 1, dep: 1, redeploy: 1, pipeline: 1, digital: q.digital.project ? 1 : .5, track: cl((util - .4) / .5, 0, 1) };
  const rawScore = Object.keys(w).reduce((s, k) => s + w[k] * qual[k], 0);
  const score = Math.round(rawScore * (.8 + .2 * docsOk / q.docs.length));
  const grade = (!hasW || missDocs >= 2) ? 'missing' : score >= K.strong ? 'strong' : score >= K.medium ? 'medium' : 'weak';

  const lane = grade === 'missing' ? 'missing'

  const verdicts = { workload: sup(W), bench: sup(B), dep: useDep ? 'cut' : 'neutral', vac: useVac ? 'cut' : 'neutral',
    redeploy: useRd ? 'cut' : 'neutral', digital: useAu ? 'cut' : 'neutral', pipeline: N ? pipe : 'neutral',
    track: util >= .8 ? 'good' : util >= K.phasedBelow ? 'mid' : 'poor' };
  // أولوية الطلب في المحفظة (0-100)
  const priority = Math.round(100 * BY.SECTOR[q.entity.sector].crit * BY.FAM_CRIT[q.famId] * (.5 + .5 * score / 100)
    * Math.min(1, .45 + 3 * Jraw / S) * (.6 + .4 * util));
  return { R, S, hasW, dep1, avail, med, std, g, stab, proj, Qw, Qb, Qstar, W, B, own, Jraw, J, underAsk, inflation: R - J,
    useDep, useVac, useRd, useAu, rdCap, autoShare, N, fill: useDep + useVac, covered: useDep + useVac + useRd + useAu,
    agree, delta, conf, qual, score, grade, lane, missing, missDocs, phased, stale, pipe, verdicts, priority, newCost,
    recRatio: N / R, supportRatio: J / R,
    steps: [
      { key: 'requested', label: 'المطلوب من الجهة', before: 0, after: R, delta: R },
      { key: 'need', ev: [1, 2], label: 'تعديل الاحتياج بالأدلة', before: R, after: J, delta: J - R },
      { key: 'dep', ev: [4], label: 'إحلال على درجات المغادرين', before: J, after: J - useDep, delta: -useDep },
      { key: 'vac', ev: [3], label: 'شغل الشواغر المعتمدة', before: J - useDep, after: J - useDep - useVac, delta: -useVac },
      { key: 'redeploy', ev: [5], label: 'تدوير داخلي بين الجهات', before: J - useDep - useVac, after: N + useAu, delta: -useRd },
      { key: 'digital', ev: [7], label: 'بديل رقمي', before: N + useAu, after: N, delta: -useAu },
      { key: 'new', label: 'التوصية: وظائف جديدة', before: 0, after: N, delta: N },
    ] };
};

/* تخصيص المحفظة: خوارزمية «حقيبة الظهر» الجشعة على القيمة الحدّية لكل ريال.
   كل وظيفة موصى بها بند مستقل؛ قيمة الوظيفة k في الطلب تتناقص خطياً حتى النصف؛ يُموَّل الترتيب من الأعلى حتى السقف. */
BY.allocate = function (items, mode, ceiling) {
  const posts = [];
  items.forEach(it => { for (let k = 1; k <= it.n; k++) {
    const mv = it.p * (1 - .5 * (k - 1) / it.n); posts.push({ id: it.id, k, cost: it.cost, mv, density: mv / (it.cost / 1e6) }); } });
  posts.sort((a, b) => b.density - a.density || a.id - b.id || a.k - b.k);
  const funded = {}; let usedPosts = 0, usedCost = 0, cut = posts.length;
  for (let i = 0; i < posts.length; i++) {
    const p = posts[i];
    if (mode === 'posts' ? usedPosts + 1 > ceiling : usedCost + p.cost > ceiling) { cut = i; break; }
    funded[p.id] = (funded[p.id] || 0) + 1; usedPosts++; usedCost += p.cost;
  }
  return { posts, funded, usedPosts, usedCost, cut, cutDensity: cut < posts.length ? posts[cut].density : 0,
    totalPosts: posts.length, totalCost: posts.reduce((s, p) => s + p.cost, 0) };
};

/* اتساق القرارات: نسبة ما اعتُمد إلى المطلوب مقابل ما أيّدته الأدلة؛ الخارج عن النطاق يُبرَز للمراجعة. */
BY.consistency = function (decided) {
  const band = BY.RULES.consistencyBand;
  return decided.map(d => { const x = d.a.recRatio, y = d.approved / d.a.R, dev = y - x;
    return { id: d.id, x, y, dev, out: Math.abs(dev) > band, generousOnWeak: dev > band && (d.a.grade === 'weak' || d.a.grade === 'missing' || d.a.grade === 'medium'), grade: d.a.grade }; });
};

BY.reviewHours = function (list, h) {
  const manual = list.length * h.manual;
  const assisted = list.reduce((s, x) => s + (x.a.lane === 'fast' ? h.fast : x.a.lane === 'missing' ? h.missing : h.deep), 0);
  return { manual, assisted, saved: manual - assisted };
};

/* بيّنة — توليد كتاب الرد الرسمي من الأدلة والقرار (قوالب نصية ثابتة؛ لا توليد لغوي آلي). */
(() => {
  const n = CGB.num, esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    else out.push(['عبء العمل', 'لم ترد بيانات عبء العمل للسنوات الثلاث الأخيرة، فاعتُمد في التقدير آخر حجم عمل موثّق لدينا مع نمو قطاعي افتراضي؛ وهو تقدير أولي يُحدَّث عند استكمال البيانات.']);
    out.push(['المقارنة المرجعية', `يبلغ وسيط الإنتاجية في ${n(q.bench.peers.length)} جهات مماثلة ${n(Math.round(a.med * 10) / 10, a.med < 100 ? 1 : 0)} لكل موظف${a.hasW ? `، مقابل ${n(Math.round(a.own * 10) / 10, a.own < 100 ? 1 : 0)} في الوحدة` : ''}؛ وبهذا الوسيط يلزم نحو ${staff(Math.ceil(a.Qb))}.`]);

    if (a.phased && e.approved >= 2) f.push(`يُفرج عن ${posts(Math.ceil(e.approved / 2))} فوراً، وعن الباقي بعد شغل 80% من الدفعة الأولى، نظراً إلى انخفاض نسبة استغلال الموافقات السابقة.`);

    if (e.digital) f.push('موافاتنا بخطة تنفيذ مشروع الأتمتة ومواعيد تشغيله.');
    if (e.approved > 0 && a.pipe === 'good') f.push(`إعطاء الأولوية في التعيين للباحثين عن عمل من القطريين المسجَّلين في التخصص (المتاح حالياً: ${n(q.pipeline.seekers)}).`);
    if (e.approved > 0 && a.pipe !== 'good') f.push('نظراً إلى قلة الباحثين عن عمل في هذا التخصص، يُنصح بربط الوظائف ببرنامج تأهيل أو ابتعاث.');
    if (a.stale > 0) f.push(`مراجعة الشواغر التي تجاوزت مدة شغورها ${K.staleMonths} شهراً (${n(a.stale)})، تمهيداً لإلغائها أو إعادة توزيعها.`);
    if (a.underAsk) f.push(`تشير البيانات إلى احتياج يزيد على المطلوب بنحو ${posts(a.underAsk)}؛ وللجهة التقدّم بطلب تكميلي مدعوم ببياناته.`);

  BY.memo = function (q, dec, decided) {

    const intro = `بالإشارة إلى كتابكم المؤرخ ${CGB.gdate(q.submitted)}م بشأن طلب استحداث ${posts(a.R)} في ${esc(q.unit)} ضمن خطة القوى العاملة لعام ${BY.CYCLE}، `, studied = `نفيدكم بأن الطلب دُرس في ضوء ${a.hasW ? 'بيانات عبء العمل' : 'البيانات المتاحة لدينا'} والمقارنات المرجعية ووضع الملاك الوظيفي للجهة، `;
    let body = '';
    if (e.type === 'return') {

        <p>ويبقى الطلب مقيَّداً لدينا برقمه المرجعي، ويُعاد عرضه تلقائياً مع بياناته المحدَّثة.</p>`;

      if (e.redeploy) d.push(`تغطية ${posts(e.redeploy)} بالنقل أو الندب من الكفاءات المتاحة في جهات حكومية أخرى.`);
      if (e.digital) d.push(`معالجة ما يعادل ${posts(e.digital)} بأتمتة الإجراءات ضمن مشروع الجهة الرقمي.`);
      body = `<p>${intro}${studied}وانتهت الدراسة إلى الآتي:</p><ol class="memo-dec">${d.map((x, i) => `<li><b>${ORD[i]}:</b> ${x}</li>`).join('')}</ol>
        <table class="memo-table"><thead><tr><th>المطلوب</th><th>استحداث جديد</th><th>شغل وظائف قائمة</th><th>تدوير داخلي</th><th>بديل رقمي</th><th>غير معتمد</th></tr></thead>
        <tbody><tr><td>${n(a.R)}</td><td><b>${n(e.approved)}</b></td><td>${n(e.fill)}</td><td>${n(e.redeploy)}</td><td>${n(e.digital)}</td><td>${n(Math.max(0, a.R - e.approved - e.fill - e.redeploy - e.digital))}</td></tr></tbody></table>

        <h4>المطلوب من الجهة</h4><ol class="memo-follow">${BY.followups(q, e).map(x => `<li>${x}</li>`).join('')}</ol>`;
    }

    return `<article class="memo" data-memo="${q.id}">
      <div class="memo-mark">نموذج تجريبي — غير صادر رسمياً</div>

        <dl class="memo-meta"><div><dt>الرقم</dt><dd>${q.memoRef}</dd></div><div><dt>التاريخ</dt><dd>${CGB.bothDates(today)}</dd></div><div><dt>المرجع</dt><dd>طلبكم ${q.ref}</dd></div></dl>
      </header>
      <p class="memo-to">السادة / ${q.entity.ar} <span>المحترمين</span></p>
      <p class="memo-greet">السلام عليكم ورحمة الله وبركاته، وبعد،</p>
      <p class="memo-subject"><b>الموضوع:</b> ${subj} — ${esc(q.unit)} (خطة القوى العاملة ${BY.CYCLE})</p>
      ${body}
      <p class="memo-close">وتفضلوا بقبول فائق الاحترام والتقدير،</p>
      <div class="memo-sign"><b>مدير إدارة تخطيط القوى العاملة</b><span>خانة التوقيع — نموذج</span></div>
      <footer class="memo-foot">وثيقة مولَّدة من قواعد معلنة وبيانات تجريبية افتراضية لأغراض العرض. الأرقام لا تمثّل أي جهة حقيقية.</footer>
    </article>`;
  };
})();

/* بيّنة — رسوم SVG صغيرة مكتوبة يدوياً. الألوان عبر أصناف CSS (f-* للتعبئة، s-* للحدّ). */
(() => {
  const n = CGB.num;
  const svg = (w, h, inner, label, cls = '') => `<svg class="ch ${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>`;
  const C = BY.ch = {};

  // 1) عبء العمل: أعمدة السنوات (الأقدم يميناً) + إسقاط 2027 + خط طاقة الكادر الحالي بالمعدل المعياري
  C.workload = (q, a) => {
    if (!a.hasW) return `<div class="ch-empty">لم ترد بيانات عبء العمل من الجهة</div>`;
    const v = [...q.workload.volume, a.proj], cap = a.avail * a.std, max = Math.max(...v, cap) * 1.12, W = 232, H = 104, b = 30, gap = 26, x0 = W - 10;
    const y = t => 84 - t / max * 68; let s = '';
    v.forEach((t, i) => { const x = x0 - (i + 1) * b - i * gap;
      s += `<rect x="${x}" y="${y(t)}" width="${b}" height="${84 - y(t)}" class="${i === 3 ? 'f-hatch s-maroon' : 'f-slate'}" ${i === 3 ? 'stroke-width="1.2" stroke-dasharray="3 2"' : ''}/>`
        + `<text x="${x + b / 2}" y="${y(t) - 4}" text-anchor="middle" class="t-val">${n(Math.round(t))}</text>`
        + `<text x="${x + b / 2}" y="97" text-anchor="middle" class="t-ax${i === 3 ? ' t-em' : ''}">${2024 + i}</text>`; });
    s += `<line x1="6" x2="${W - 6}" y1="${y(cap)}" y2="${y(cap)}" class="s-ink" stroke-width="1" stroke-dasharray="1.5 3"/>`
      + `<line x1="6" x2="${W - 6}" y1="84" y2="84" class="s-rule" stroke-width="1"/>`;
    return svg(W, H, s, 'حجم العمل السنوي وإسقاط 2027 مقابل طاقة الكادر');
  };

  // 2) المقارنة المرجعية: شريط نقاط لإنتاجية الجهات المماثلة، الوسيط، وموضع الوحدة
  C.strip = (q, a) => {
    const pts = [...q.bench.peers, a.med, ...(a.own ? [a.own] : [])], lo = Math.min(...pts), hi = Math.max(...pts), pad = (hi - lo) * .12 || 1;
    const W = 232, H = 62, x = t => 14 + (t - (lo - pad)) / (hi - lo + 2 * pad) * (W - 28); let s = `<line x1="10" x2="${W - 10}" y1="34" y2="34" class="s-rule" stroke-width="1"/>`;
    q.bench.peers.forEach(p => { s += `<circle cx="${x(p)}" cy="34" r="4.2" class="f-sheet s-ink3" stroke-width="1.2"/>`; });
    s += `<line x1="${x(a.med)}" x2="${x(a.med)}" y1="18" y2="50" class="s-brass" stroke-width="2"/><text x="${x(a.med)}" y="12" text-anchor="middle" class="t-ax">${n(a.med, a.med < 100 ? 1 : 0)}</text>`;
    if (a.own) { const xo = x(a.own); s += `<path d="M${xo} 26l7 8-7 8-7-8z" class="f-maroon"/><text x="${xo}" y="58" text-anchor="middle" class="t-val t-em">${n(a.own, a.own < 100 ? 1 : 0)}</text>`; }
    return svg(W, H, s, 'إنتاجية الوحدة مقابل الجهات المماثلة');
  };

  // 3 و5) مربعات/دوائر عدّ: المستخدَم مملوء، المتاح غير المستخدَم مفرَّغ
  C.units = (total, used, round, half = 0) => {
    if (!total) return `<div class="ch-empty">${round ? 'لا مرشحين مناسبين حالياً' : 'لا شواغر معتمدة في المجموعة'}</div>`;
    const show = Math.min(total, 36), per = 12, sz = 14, g = 5, W = per * (sz + g), H = Math.ceil(show / per) * (sz + g) + 2; let s = '';
    for (let i = 0; i < show; i++) { const cx = W - (i % per + 1) * (sz + g) + g, cy = Math.floor(i / per) * (sz + g) + 1;
      const cls = i < used ? 'f-slate s-slate' : i < half ? 'f-slate-t s-slate' : 'f-sheet s-ink3';
      s += round ? `<circle cx="${cx + sz / 2}" cy="${cy + sz / 2}" r="${sz / 2 - .6}" class="${cls}" stroke-width="1.2"/>` : `<rect x="${cx}" y="${cy}" width="${sz}" height="${sz}" class="${cls}" stroke-width="1.2"/>`; }
    return svg(W, H, s, `${used} من ${total}`, 'ch-units') + (total > show ? `<span class="ch-more">+${n(total - show)}</span>` : '');
  };

  // 4) المغادرون: تقاعد 2027-2029 (سنة الخطة مُبرَزة ويُضاف إليها الترك المتوقع)
  C.departures = (q) => {
    const r = q.departures.ret, at = q.departures.attrExp, max = Math.max(r[0] + at, r[1], r[2], 1) * 1.25, W = 232, H = 96, b = 40, gap = 26, x0 = W - 20;
    const y = t => 76 - t / max * 60; let s = '';
    r.forEach((t, i) => { const x = x0 - (i + 1) * b - i * gap, top = i === 0 ? t + at : t;
      s += `<rect x="${x}" y="${y(t)}" width="${b}" height="${76 - y(t)}" class="${i === 0 ? 'f-slate' : 'f-ink4'}"/>`;
      if (i === 0 && at) s += `<rect x="${x}" y="${y(t + at)}" width="${b}" height="${y(t) - y(t + at)}" class="f-slate-t s-slate" stroke-width="1"/>`;
      s += `<text x="${x + b / 2}" y="${y(top) - 4}" text-anchor="middle" class="t-val${i === 0 ? ' t-em' : ''}">${n(top)}</text><text x="${x + b / 2}" y="90" text-anchor="middle" class="t-ax${i === 0 ? ' t-em' : ''}">${2027 + i}</text>`; });
    s += `<line x1="6" x2="${W - 6}" y1="76" y2="76" class="s-rule" stroke-width="1"/>`;
    return svg(W, H, s, 'المغادرون المتوقعون 2027 إلى 2029');
  };

  // 7) حلقة نسبة قابلية الأتمتة
  C.ring = (share, active) => { const r = 26, c = 2 * Math.PI * r;
    return svg(72, 72, `<circle cx="36" cy="36" r="${r}" fill="none" class="s-rule2" stroke-width="9"/><circle cx="36" cy="36" r="${r}" fill="none" class="${active ? 's-slate' : 's-ink4'}" stroke-width="9" stroke-dasharray="${c * share} ${c}" transform="rotate(-90 36 36)"/><text x="36" y="40" text-anchor="middle" class="t-big">${Math.round(share * 100)}%</text>`, 'نسبة العمل القابل للأتمتة', 'ch-ring'); };

  // 8) سجل الاستغلال: المعتمد مقابل المشغول في الدورتين السابقتين
  C.track = (t) => { const max = Math.max(...t.cycles.map(c => c.approved)) * 1.2, W = 232, H = 96, b = 26, y = v => 76 - v / max * 60; let s = '';
    t.cycles.forEach((c, i) => { const x = W - 34 - (i + 1) * 2 * b - i * 44;
      s += `<rect x="${x + b}" y="${y(c.approved)}" width="${b}" height="${76 - y(c.approved)}" class="f-sheet s-ink3" stroke-width="1.2"/><rect x="${x}" y="${y(c.filled)}" width="${b}" height="${76 - y(c.filled)}" class="f-brass"/>`
        + `<text x="${x + b * 1.5}" y="${y(c.approved) - 4}" text-anchor="middle" class="t-val">${n(c.approved)}</text><text x="${x + b / 2}" y="${y(c.filled) - 4}" text-anchor="middle" class="t-val t-em">${n(c.filled)}</text><text x="${x + b}" y="90" text-anchor="middle" class="t-ax">${c.year}</text>`; });
    s += `<line x1="6" x2="${W - 6}" y1="76" y2="76" class="s-rule" stroke-width="1"/>`;
    return svg(W, H, s, 'الوظائف المعتمدة والمشغولة في الدورتين السابقتين'); };

  // منحنى القيمة الحدّية للمحفظة مع خط القطع
  C.curve = (al, mode) => {
    const W = 760, H = 250, L = 46, Rr = 14, T = 16, B = 34, P = al.posts; if (!P.length) return '<div class="ch-empty">لا وظائف موصى بها</div>';
    const tot = mode === 'posts' ? P.length : al.totalCost, used = mode === 'posts' ? al.usedPosts : al.usedCost, ymax = P[0].density * 1.08;
    const x = v => (W - L) - v / tot * (W - L - Rr), y = v => T + (1 - v / ymax) * (H - T - B);   // RTL: zero on the right, like the ceiling slider
    let cum = 0, d = `M${x(0)} ${y(P[0].density)}`, area = `M${x(0)} ${y(0)}L${x(0)} ${y(P[0].density)}`;
    P.forEach((p, i) => { const step = mode === 'posts' ? 1 : p.cost, x1 = x(cum + step);
      d += `L${x1} ${y(p.density)}`; if (i + 1 < P.length) d += `L${x1} ${y(P[i + 1].density)}`;
      if (i < al.cut) { area += `L${x1} ${y(p.density)}`; if (i + 1 < al.cut) area += `L${x1} ${y(P[i + 1].density)}`; else area += `L${x1} ${y(0)}`; }
      cum += step; });
    let s = '';
    for (let i = 0; i <= 4; i++) { const v = ymax / 1.08 * i / 4; s += `<line x1="${Rr}" x2="${W - L}" y1="${y(v)}" y2="${y(v)}" class="s-rule2" stroke-width="1"/><text x="${W - L + 6}" y="${y(v) + 3}" text-anchor="start" class="t-ax">${n(v, 0)}</text>`; }
    for (let i = 0; i <= 5; i++) { const v = tot * i / 5; s += `<text x="${x(v)}" y="${H - 14}" text-anchor="middle" class="t-ax">${mode === 'posts' ? n(Math.round(v)) : n(v / 1e6, 0) + 'M'}</text>`; }
    if (al.cut > 0) s += `<path d="${area}Z" class="f-maroon-t"/>`;
    s += `<path d="${d}" fill="none" class="s-ink" stroke-width="1.6" stroke-linejoin="round"/>`;
    s += `<line x1="${x(used)}" x2="${x(used)}" y1="${T - 6}" y2="${H - B}" class="s-maroon" stroke-width="2" stroke-dasharray="5 3"/><circle cx="${x(used)}" cy="${y(al.cutDensity || 0)}" r="4.5" class="f-maroon"/>`;

  C.scatter = (pts) => {
    const W = 420, H = 330, L = 44, Rr = 14, T = 14, B = 36, band = BY.RULES.consistencyBand;

        dl([['حدّ الاعتماد المرحلي', 'دون ' + pct(r.phasedBelow)], ['القاعدة', 'لا يغيّر العدد؛ يشترط الإفراج على دفعتين ويخفض الأولوية']])),

  /* ---------- لوحة القرار ---------- */
  const decideHTML = q => { const a = q.a, d = st.dec[q.id], max = a.R + a.underAsk;

    const items = [...new Set([...a.missing, ...EXTRA_ITEMS])];
    const panel = { approve: `<p class="dc-sum">استحداث <b>${n(a.N)}</b> · شغل وظائف قائمة <b>${n(a.fill)}</b> · تدوير <b>${n(a.useRd)}</b> · بديل رقمي <b>${n(a.useAu)}</b></p>`,

  const memoHTML = q => { const d = st.dec[q.id]; return BY.memo(q, d || BY.draftOf(q), !!d); };
  const refreshMemo = () => { const q = D.reqs[st.sel]; $('#memo-wrap').innerHTML = memoHTML(q);

  const refreshDecide = () => { $('#decide').innerHTML = decideHTML(D.reqs[st.sel]); refreshMemo(); };

  BY.views.dossier = () => { const q = D.reqs[st.sel], a = q.a, s = BY.status(q), list = BY.filtered(), ix = list.findIndex(x => x.id === q.id);

        <div class="ds-say" id="ds-say"><span class="eyebrow">ما تقوله الأدلة</span>
          <p class="say-num"><b>${n(a.N)}</b> وظيفة جديدة <small>مدى الثقة من ${n(a.conf[0])} إلى ${n(a.conf[1])}</small></p>
          <ul class="say-parts"><li><b>${n(a.fill)}</b>شغل وظائف قائمة</li><li><b>${n(a.useRd)}</b>تدوير داخلي</li><li><b>${n(a.useAu)}</b>بديل رقمي</li><li><b>${n(a.R - a.J)}</b>غير مؤيَّد</li></ul>
          <p class="say-strength">${BY.ch.meter(a, true)} <span>قوة الأدلة من 100 · ${laneWhy(q)}</span></p>

        <p class="rule-note">${BY.ico('info')} القواعد معلنة وثابتة لكل الطلبات، وليست ذكاءً اصطناعياً. يمكن إعادة احتساب كل رقم يدوياً من المدخلات المعروضة.</p></section>

      <section class="ds-bottom"><div class="decide" id="decide">${decideHTML(q)}</div>
        <div class="memo-col"><div class="sec-h"><h2>كتاب الرد</h2><span class="memo-tools"><span class="hint" id="memo-state">${st.dec[q.id] ? 'يعكس القرار المسجَّل' : 'مسودة تتغيّر مع اختيارك'}</span>
          <button class="btn small" data-act="memo-print">${BY.ico('print')} طباعة</button><button class="btn small" data-act="memo-export">${BY.ico('down')} تصدير</button></span></div>

  BY.after.dossier = () => { const q = D.reqs[st.sel], df = $('#dc-diff'); if (df) { const x = (+BY.draftOf(q).approved || 0) - q.a.N; df.innerHTML = x ? `${L(CGB.signed(x))} عن التوصية` : 'مطابق للتوصية'; } };

    'ds-step': el => { const list = BY.filtered(), ix = list.findIndex(x => x.id === st.sel), nx = list[ix + (+el.dataset.d)]; if (nx) BY.open(nx.id); },
    formulas: () => { st.formulas = !st.formulas; const y = window.scrollY; BY.render(); window.scrollTo(0, y); },
    'ev-jump': el => { const c = $('#ev-' + el.dataset.ev); if (!c) return; c.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); },
    'memo-print': () => BY.printMemo($('#memo-wrap').innerHTML),
    'memo-export': () => { const q = D.reqs[st.sel]; BY.exportBox('تصدير كتاب الرد', `bayyina-memo-${q.no}.txt`, $('#memo-wrap .memo').innerText.replace(/\n{3,}/g, '\n\n')); },
  });
})();

/* بيّنة — ③ المحفظة: السقف وخط القطع، توزيع القطاعات، سجل الجهات، اتساق القرارات · ④ سجل القرارات */
(() => {
  const { $, st, D } = BY, n = CGB.num, esc = BY.txt.esc, pct = CGB.pct;

  const full = () => { const it = BY.items(); return { posts: it.reduce((s, i) => s + i.n, 0), cost: it.reduce((s, i) => s + i.n * i.cost, 0) }; };
  BY.alloc = () => { const f = full(); if (!st.ceil) st.ceil = st.mode === 'posts' ? Math.round(f.posts * .7) : Math.round(f.cost * .7 / 1e5) * 1e5;

  const ceilText = () => st.mode === 'posts' ? `${n(st.ceil)} وظيفة` : CGB.qar(st.ceil);

    const rows = D.reqs.filter(q => BY.approvedOf(q) > 0).map(q => { const want = BY.approvedOf(q), got = al.funded[q.id] || 0, dec = BY.status(q) !== 'open';
      if (got === want) fullN++; else if (got > 0) part++; else below++; if (dec && got < want) decBelow++;
      return { q, want, got, dec, top: q.a.priority / (q.costPerPost / 1e6) }; }).sort((a, b) => b.top - a.top);
    const sect = CGB.SECTORS.map(s => { const qs = D.reqs.filter(q => q.entity.sector === s.id);
      return { s, R: qs.reduce((t, q) => t + q.a.R, 0), want: qs.reduce((t, q) => t + BY.approvedOf(q), 0), got: qs.reduce((t, q) => t + (al.funded[q.id] || 0), 0) }; });
    const smax = Math.max(...sect.map(x => x.R));
    return `<div class="pf-kpis"><div><b>${n(al.usedPosts)}</b><span>وظيفة ضمن السقف من ${n(f.posts)}</span></div><div><b>${CGB.qar(al.usedCost)}</b><span>كلفتها السنوية من ${CGB.qar(f.cost)}</span></div>
        <div><b>${n(fullN)}</b><span>طلباً يُموَّل كاملاً</span></div><div><b>${n(part)}</b><span>يُموَّل جزئياً</span></div><div><b>${n(below)}</b><span>دون خط القطع</span></div>
        <div class="${decBelow ? 'warn' : ''}"><b>${n(decBelow)}</b><span>قراراً معتمداً يتجاوز السقف</span></div></div>
      <section class="pf-curve"><div class="sec-h"><h2>منحنى القيمة الحدّية وخط القطع</h2><span class="hint">كل درجة في المنحنى وظيفة؛ المظلَّل ما يتّسع له السقف</span></div>
        <div class="axis-y">قيمة الوظيفة لكل مليون ر.ق</div><div class="ch-scroll">${BY.ch.curve(al, st.mode)}</div><div class="axis-x">${st.mode === 'posts' ? 'الوظائف مرتّبة من الأعلى قيمة (عدد تراكمي)' : 'الكلفة السنوية التراكمية (مليون ر.ق) للوظائف مرتّبة من الأعلى قيمة'}</div>
        <p class="rule-note">${BY.ico('info')} خوارزمية «حقيبة الظهر» الجشعة على القيمة الحدّية: تُرتَّب الوظائف بقيمتها لكل ريال (أولوية القطاع والمجموعة × قوة الأدلة × شدة الاحتياج × سجل الجهة) وتتناقص قيمة كل وظيفة إضافية في الطلب نفسه، ثم يُموَّل الترتيب حتى السقف.</p></section>
      <section class="pf-two"><div class="pf-rank"><div class="sec-h"><h2>ترتيب الطلبات</h2><span class="hint">${n(rows.length)} طلباً فيها استحداث</span></div>
          <div class="tbl-wrap tall"><table class="tbl"><thead><tr><th>الطلب</th><th>الجهة والوحدة</th><th>الأولوية</th><th>ضمن السقف</th><th>الموقع</th></tr></thead><tbody>

      </tbody></table></div>`; };
  Object.assign(BY.ins, { 'log-type': el => { st.logType = el.value; BY.render(); } });
  Object.assign(BY.acts, {
    'log-snap': el => { st.logOpen = st.logOpen === el.dataset.k ? null : el.dataset.k; const y = window.scrollY; BY.render(); window.scrollTo(0, y); },
    'log-export': () => { const rows = [['الوقت', 'رقم الطلب', 'الجهة', 'الوحدة', 'القرار', 'المطلوب', 'التوصية', 'المعتمد', 'شغل وظائف قائمة', 'تدوير داخلي', 'بديل رقمي', 'مخالف للتوصية', 'اعتماد جماعي', 'السبب', 'قوة الأدلة', 'درجة القوة', 'المسار', 'تقدير عبء العمل', 'تقدير المقارنة', 'بواسطة']];

/* بيّنة — جولة العرض، درج المنهجية، التشغيل */
(() => {
  const { $, st, D } = BY, n = CGB.num, pct = CGB.pct;

  /* ---------- جولة العرض: ست محطات تروي القصة وتقود الواجهة ---------- */
  const sc = q => q.a.steps.filter(s => s.delta < 0).length * 100 + (q.a.grade === 'strong' ? 150 : 0) + Math.min(q.a.R, 60);
  const showcase = () => { const hero = D.reqs.find(q => q.hero && BY.status(q) === 'open'); if (hero) return hero; const pick = D.reqs.filter(q => BY.status(q) === 'open' && q.a.lane === 'deep' && q.a.hasW && q.a.R >= 18 && q.a.N >= 3)

    { sel: '#lanes', pre: () => BY.go('inbox', true),
      t: 'ثلاثة مسارات بدل طابور واحد', b: () => `الطلبات الصغيرة ذات الأدلة القوية تُعتمد جماعياً من «المسار السريع»، والناقصة تُعاد إلى الجهة بقائمة ما ينقصها، ويبقى وقت المحلل للمراجعة المعمّقة. التقدير الحالي: ${n(Math.round(BY.hours().saved))} ساعة مراجعة موفَّرة في الدورة.` },
    { sel: '#wf', pre: () => { st.formulas = false; BY.open(showcase().id); },
      t: 'الشلّال: كيف صار المطلوب توصية', b: () => { const q = D.reqs[st.sel]; return `${q.entity.ar} طلبت ${n(q.a.R)} وظيفة. كل شريط دليل: الاحتياج المبرَّر بعبء العمل والمقارنة المرجعية، ثم ما يُسدّ بالإحلال والشواغر والتدوير والأتمتة. الباقي ${n(q.a.N)} وظيفة جديدة. اضغط أي شريط لترى دليله، أو أظهر الصيغ والمدخلات.`; } },
    { sel: '.ds-bottom', pre: () => { const q = D.reqs[st.sel]; BY.go('dossier', true); const d = BY.draftOf(q); d.type = 'amend'; d.approved = Math.min(q.a.R, q.a.N + 3); d.reason = ''; BY.render(); },
      t: 'القرار للمحلل، والمخالفة بسبب مكتوب', b: () => 'يستطيع المحلل اعتماد التوصية أو تعديلها أو إرجاء الطلب أو إعادته. إن خالف الأدلة صار السبب إلزامياً، ويُحفظ في السجل ويظهر في كتاب الرد الذي يُكتب تلقائياً من الأدلة ويُطبع جاهزاً.' },
    { sel: '#pf-top', pre: () => BY.go('portfolio'),
      t: 'السقف وخط القطع', b: () => 'حين يكون للاستحداث سقف، تُرتَّب كل الوظائف الموصى بها بقيمتها لكل ريال. حرِّك السقف لترى فوراً ما يدخل وما يخرج، وتوزيع ذلك على القطاعات. وفي أسفل الصفحة رسم يكشف القرارات الخارجة عن نسق مثيلاتها.' },
    { sel: '#lg-head', pre: () => BY.go('log'),

  let ix = 0;

  const show = () => { const s = STEPS[ix]; s.pre(); const c = $('#tour-card');

    <h4>من المطلوب إلى التوصية</h4>

      <li><b>التوصية:</b> ما بقي بعد ذلك وظائف جديدة. مدى الثقة نصف الفرق بين التقديرين.</li></ol>

    <p><b>مسار سريع:</b> أدلة قوية، تقارب التقديرين ${pct(K.fast.minAgree)} فأعلى، طلب لا يتجاوز ${K.fast.maxPosts} وظيفة ولا تتجاوز كلفة الجديد ${CGB.qar(K.fast.maxCost)}، وسجل استغلال ${pct(K.fast.minUtil)} فأعلى. <b>أدلة ناقصة:</b> درجة «ناقصة». <b>مراجعة معمّقة:</b> ما عدا ذلك.</p>
    <h4>تخصيص المحفظة</h4>
    <p>خوارزمية «حقيبة الظهر» الجشعة على القيمة الحدّية: أولوية الطلب = أولوية القطاع × أولوية المجموعة × قوة الأدلة × شدة الاحتياج × سجل الجهة. تتناقص قيمة كل وظيفة إضافية في الطلب نفسه خطياً حتى النصف، وتُموَّل الوظائف بترتيب قيمتها لكل ريال حتى السقف. أوزان الأولوية افتراضات للعرض تحدّدها الإدارة عند التطبيق.</p>
    <h4>اتساق القرارات</h4>
    <p>تُقارَن نسبة المعتمد إلى المطلوب بنسبة ما أيّدته الأدلة. ما ابتعد أكثر من ${Math.round(K.consistencyBand * 100)} نقطة مئوية يُبرَز للمراجعة، ولا يُمنع.</p>
    <h4>تقدير الوقت</h4>
    <p>افتراضات قابلة للتعديل: ${K.hours.manual} ساعات للمراجعة اليدوية للطلب، ${K.hours.fast} ساعة للمسار السريع، ${K.hours.deep} للمراجعة المعمّقة، ${K.hours.missing} لطلب الأدلة الناقصة. تقدير للعرض وليس قياساً.</p>
    <h4>حدود النموذج</h4>
    <ul><li>المعدلات المعيارية وقابلية الأتمتة وأوزان الأولوية قيم افتراضية تحتاج إلى اعتماد من أصحاب الاختصاص.</li><li>لا يحفظ النموذج القرارات بعد إغلاق الصفحة، ولا يتصل بأي نظام.</li><li>كتاب الرد نموذج تجريبي غير صادر رسمياً، ولا يحمل شعاراً أو ختماً أو توقيعاً.</li></ul>`;
  function L(s) { return `<span class="ltr" dir="ltr">${s}</span>`; }

  /* ---------- التشغيل ---------- */
  BY.seed(); st.sel = showcase().id;
  const fromHash = () => { const h = location.hash.replace('#', ''); return BY.views[h] ? h : 'inbox'; };
  st.view = fromHash(); BY.render();
  window.addEventListener('hashchange', () => { const v = fromHash(); if (v !== st.view && !BY.tourOn) { st.view = v; BY.render(); } });
})();
